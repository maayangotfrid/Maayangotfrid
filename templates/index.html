<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AliExpress → Shopify Importer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #e43b27;
      --accent2: #96bf48;
      --text: #e8eaf0;
      --muted: #7a7f9a;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    header .badge {
      font-size: 0.7rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
    }

    #shopify-status {
      margin-right: auto;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.green { background: var(--accent2); }
    .dot.red { background: var(--accent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 6px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 7px;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all .2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-size: 0.78rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"], input[type="url"], textarea, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="text"]:focus, input[type="url"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    input[type="text"], input[type="url"] { flex: 1; }

    textarea { width: 100%; resize: vertical; min-height: 80px; }

    btn, .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      transition: opacity .2s, transform .1s;
    }

    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--accent2); color: #fff; }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Product grid */
    #products-area { display: none; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      transition: border-color .2s;
    }

    .product-card.selected { border-color: var(--accent2); }

    .product-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--surface2);
    }

    .product-card .p-body { padding: 12px; }
    .product-card .p-title {
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-card .p-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .product-card .p-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
    }

    .product-card.selected .p-check {
      background: var(--accent2);
      border-color: var(--accent2);
    }

    .product-card .p-check::after {
      content: '✓';
      color: #fff;
      font-size: 0.7rem;
      display: none;
    }

    .product-card.selected .p-check::after { display: block; }

    /* Import panel */
    .import-config {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 24px;
    }

    .import-config h3 { font-size: 0.92rem; margin-bottom: 14px; color: var(--muted); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--muted); }

    select { width: 100%; }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .selected-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-right: auto;
    }

    /* Results */
    #import-results { margin-top: 20px; }

    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface2);
      border-radius: 7px;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .result-item .status-icon { font-size: 1rem; }
    .result-item a { color: var(--accent2); text-decoration: none; }
    .result-item a:hover { text-decoration: underline; }
    .result-item .err { color: var(--accent); font-size: 0.8rem; }

    /* Loader */
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-overlay {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      margin: 16px 0;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: transform .3s;
      z-index: 999;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* CSV drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(228,59,39,.05);
    }

    .dropzone input { display: none; }
    .dropzone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .dropzone p { font-size: 0.9rem; }
    .dropzone small { font-size: 0.78rem; margin-top: 6px; display: block; }

    .edit-btn {
      font-size: 0.75rem;
      padding: 4px 10px;
      margin-top: 8px;
    }

    .edit-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .edit-modal-overlay.open { display: flex; }

    .edit-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 90%;
      max-width: 540px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .edit-modal h3 { margin-bottom: 16px; font-size: 1rem; }
    .edit-modal .form-group { margin-bottom: 12px; }
    .edit-modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

    /* Image thumbnails */
    .p-thumbs {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .p-thumbs img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color .2s;
    }
    .p-thumbs img:hover { border-color: var(--accent); }
    .p-thumbs .more-imgs {
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Variant chips */
    .variant-group {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }
    .variant-label {
      font-size: 0.72rem;
      color: var(--muted);
      min-width: fit-content;
    }
    .variant-chip {
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--text);
    }
    .variant-more {
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Main image switcher */
    .product-card .p-main-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--surface2);
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>AliExpress → Shopify <span class="badge">Importer</span></h1>
  </div>
  <div id="shopify-status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">בודק חיבור...</span>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('url')">🔗 URL בודד</button>
    <button class="tab-btn" onclick="switchTab('search')">🔍 חיפוש</button>
    <button class="tab-btn" onclick="switchTab('csv')">📄 CSV</button>
  </div>

  <!-- URL Tab -->
  <div class="tab-panel active" id="tab-url">
    <div class="card">
      <h2>הדבק קישור מוצר מ-AliExpress</h2>
      <div class="input-row">
        <input type="url" id="product-url" placeholder="https://www.aliexpress.com/item/..." dir="ltr" />
        <button class="btn btn-primary" onclick="scrapeUrl()">שלוף מידע</button>
      </div>
    </div>
  </div>

  <!-- Search Tab -->
  <div class="tab-panel" id="tab-search">
    <div class="card">
      <h2>חפש מוצרים לפי מילת מפתח</h2>
      <div class="input-row">
        <input type="text" id="search-keyword" placeholder="לדוגמה: wireless earbuds" dir="ltr" />
        <button class="btn btn-primary" onclick="doSearch()">חפש</button>
      </div>
    </div>
  </div>

  <!-- CSV Tab -->
  <div class="tab-panel" id="tab-csv">
    <div class="card">
      <h2>העלה קובץ CSV עם קישורים</h2>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('csv-input').click()">
        <input type="file" id="csv-input" accept=".csv" onchange="handleCsvFile(this.files[0])" />
        <div class="icon">📂</div>
        <p>לחץ או גרור קובץ CSV לכאן</p>
        <small>הקובץ חייב להכיל עמודה בשם <strong>url</strong> עם קישורי AliExpress</small>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading" style="display:none">
    <div class="loader"></div>
    <span id="loading-text">שולף מידע...</span>
  </div>

  <!-- Products Area -->
  <div id="products-area">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="font-size:1rem;">מוצרים שנמצאו</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="selectAll()">בחר הכל</button>
        <button class="btn btn-ghost" onclick="deselectAll()">בטל הכל</button>
      </div>
    </div>

    <div class="product-grid" id="product-grid"></div>

    <div class="import-config" id="import-config" style="display:none">
      <h3>הגדרות ייבוא</h3>
      <div class="form-row">
        <div class="form-group">
          <label>אוסף (Collection)</label>
          <select id="collection-select">
            <option value="">ללא אוסף</option>
          </select>
        </div>
        <div class="form-group">
          <label>סטטוס מוצר</label>
          <select id="publish-status">
            <option value="draft">טיוטה (Draft)</option>
            <option value="active">פעיל (Active)</option>
          </select>
        </div>
      </div>
      <div class="actions-bar">
        <span class="selected-count" id="selected-count">0 מוצרים נבחרו</span>
        <button class="btn btn-success" onclick="importSelected()" id="import-btn">
          ☁️ ייבא לשופיפיי
        </button>
      </div>
    </div>

    <div id="import-results"></div>
  </div>
</main>

<!-- Edit Modal -->
<div class="edit-modal-overlay" id="edit-modal-overlay">
  <div class="edit-modal">
    <h3>עריכת מוצר</h3>
    <div class="form-group">
      <label>שם מוצר</label>
      <input type="text" id="edit-title" />
    </div>
    <div class="form-group">
      <label>מחיר ($)</label>
      <input type="text" id="edit-price" dir="ltr" />
    </div>
    <div class="form-group">
      <label>תיאור</label>
      <textarea id="edit-description"></textarea>
    </div>
    <div class="edit-modal-actions">
      <button class="btn btn-ghost" onclick="closeEditModal()">ביטול</button>
      <button class="btn btn-primary" onclick="saveEdit()">שמור</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let allProducts = [];
  let selectedIds = new Set();
  let editingIdx = null;
  let collections = [];

  // ---- Init ----
  async function init() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const sel = document.getElementById('collection-select');

      if (data.configured) {
        dot.className = 'dot green';
        text.textContent = 'מחובר לשופיפיי';
        collections = data.collections || [];
        for (const c of collections) {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.title;
          sel.appendChild(opt);
        }
      } else {
        dot.className = 'dot red';
        text.textContent = 'לא מחובר לשופיפיי — הגדר .env';
      }
    } catch {}
  }

  // ---- Tabs ----
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', ['url','search','csv'][i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach((p, i) => {
      p.classList.toggle('active', ['tab-url','tab-search','tab-csv'][i] === 'tab-' + name);
    });
  }

  // ---- URL Scrape ----
  async function scrapeUrl() {
    const url = document.getElementById('product-url').value.trim();
    if (!url) return toast('הכנס URL');
    showLoading('שולף מידע מ-AliExpress...');
    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
      });
      const data = await res.json();
      if (data.error) { toast('שגיאה: ' + data.error); return; }
      setProducts([data]);
    } catch (e) {
      toast('שגיאת רשת');
    } finally {
      hideLoading();
    }
  }

  // ---- Search ----
  async function doSearch() {
    const keyword = document.getElementById('search-keyword').value.trim();
    if (!keyword) return toast('הכנס מילת חיפוש');
    showLoading('מחפש ב-AliExpress...');
    try {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({keyword})
      });
      const data = await res.json();
      if (data.error) { toast('שגיאה: ' + data.error); return; }
      const products = (data.results || []).map(r => ({
        title: r.title,
        price: r.price ? r.price.replace(/[^\d.]/g, '') : '0',
        images: r.image ? [r.image] : [],
        description: '',
        variants: [],
        source_url: r.url,
        status: 'ok'
      }));
      if (!products.length) { toast('לא נמצאו תוצאות'); return; }
      setProducts(products);
    } catch (e) {
      toast('שגיאת רשת');
    } finally {
      hideLoading();
    }
  }

  // ---- CSV ----
  function handleCsvFile(file) {
    if (!file) return;
    const zone = document.getElementById('dropzone');
    zone.style.borderColor = 'var(--accent2)';
    showLoading('מעבד קובץ CSV...');

    const formData = new FormData();
    formData.append('file', file);

    fetch('/api/import-csv', {method: 'POST', body: formData})
      .then(r => r.json())
      .then(data => {
        if (data.error) { toast('שגיאה: ' + data.error); return; }
        setProducts(data.products || []);
      })
      .catch(() => toast('שגיאת רשת'))
      .finally(hideLoading);
  }

  // Setup drag-drop
  const dropzone = document.getElementById('dropzone');
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) handleCsvFile(f);
  });

  // ---- Products Rendering ----
  function setProducts(products) {
    allProducts = products.filter(p => p.status === 'ok');
    selectedIds = new Set(allProducts.map((_, i) => i));
    renderGrid();
    document.getElementById('products-area').style.display = 'block';
    document.getElementById('import-config').style.display = 'block';
    updateCount();
  }

  function renderVariantChips(variants) {
    if (!variants || !variants.length) return '';
    return variants.map(v => `
      <div class="variant-group">
        <span class="variant-label">${escHtml(v.name)}:</span>
        ${v.values.slice(0, 6).map(val => `<span class="variant-chip">${escHtml(val)}</span>`).join('')}
        ${v.values.length > 6 ? `<span class="variant-more">+${v.values.length - 6}</span>` : ''}
      </div>
    `).join('');
  }

  function renderThumbs(images, cardIdx) {
    if (!images || images.length <= 1) return '';
    const thumbs = images.slice(1, 5).map(src =>
      `<img src="${src}" loading="lazy" onclick="switchMainImg(${cardIdx}, '${src}')" title="לחץ להחלפת תמונה" />`
    ).join('');
    const extra = images.length > 5 ? `<div class="more-imgs">+${images.length - 5}</div>` : '';
    return `<div class="p-thumbs">${thumbs}${extra}</div>`;
  }

  function switchMainImg(cardIdx, src) {
    const card = document.querySelector(`.product-card[data-idx="${cardIdx}"]`);
    if (card) {
      const main = card.querySelector('.p-main-img');
      if (main) main.src = src;
    }
  }

  function renderGrid() {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';
    allProducts.forEach((p, i) => {
      const img = p.images && p.images[0] ? p.images[0] : '';
      const card = document.createElement('div');
      card.className = 'product-card' + (selectedIds.has(i) ? ' selected' : '');
      card.dataset.idx = i;
      card.innerHTML = `
        <div class="p-check" onclick="toggleSelect(${i})"></div>
        ${img
          ? `<img class="p-main-img" src="${img}" loading="lazy" />`
          : '<div style="aspect-ratio:1;background:var(--surface2)"></div>'}
        <div class="p-body">
          <div class="p-title">${escHtml(p.title || 'ללא שם')}</div>
          <div class="p-price">$${p.price || '0'}</div>
          ${renderThumbs(p.images, i)}
          ${renderVariantChips(p.variants)}
          <button class="btn btn-ghost edit-btn" onclick="openEdit(${i})">✏️ עריכה</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function toggleSelect(i) {
    if (selectedIds.has(i)) selectedIds.delete(i);
    else selectedIds.add(i);
    const card = document.querySelector(`.product-card[data-idx="${i}"]`);
    card.classList.toggle('selected', selectedIds.has(i));
    updateCount();
  }

  function selectAll() {
    allProducts.forEach((_, i) => selectedIds.add(i));
    renderGrid();
    updateCount();
  }

  function deselectAll() {
    selectedIds.clear();
    renderGrid();
    updateCount();
  }

  function updateCount() {
    document.getElementById('selected-count').textContent = `${selectedIds.size} מוצרים נבחרו`;
  }

  // ---- Edit Modal ----
  function openEdit(idx) {
    editingIdx = idx;
    const p = allProducts[idx];
    document.getElementById('edit-title').value = p.title || '';
    document.getElementById('edit-price').value = p.price || '';
    document.getElementById('edit-description').value = p.description || '';
    document.getElementById('edit-modal-overlay').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('edit-modal-overlay').classList.remove('open');
    editingIdx = null;
  }

  function saveEdit() {
    if (editingIdx === null) return;
    allProducts[editingIdx].title = document.getElementById('edit-title').value;
    allProducts[editingIdx].price = document.getElementById('edit-price').value;
    allProducts[editingIdx].description = document.getElementById('edit-description').value;
    closeEditModal();
    renderGrid();
    toast('המוצר עודכן');
  }

  // ---- Import to Shopify ----
  async function importSelected() {
    if (!selectedIds.size) return toast('בחר לפחות מוצר אחד');
    const btn = document.getElementById('import-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="loader"></div> מייבא...';

    const collectionId = document.getElementById('collection-select').value;
    const publishStatus = document.getElementById('publish-status').value;

    const products = [...selectedIds].map(i => ({
      ...allProducts[i],
      collection_id: collectionId || null,
      publish_status: publishStatus,
    }));

    try {
      const res = await fetch('/api/import-to-shopify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({products})
      });
      const data = await res.json();
      if (data.error) { toast('שגיאה: ' + data.error); return; }
      renderResults(data.results || []);
    } catch {
      toast('שגיאת רשת');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '☁️ ייבא לשופיפיי';
    }
  }

  function renderResults(results) {
    const container = document.getElementById('import-results');
    container.innerHTML = '<h3 style="margin-bottom:12px;font-size:.92rem;color:var(--muted)">תוצאות ייבוא</h3>';
    for (const r of results) {
      const div = document.createElement('div');
      div.className = 'result-item';
      if (r.status === 'ok') {
        div.innerHTML = `<span class="status-icon">✅</span> <strong>${escHtml(r.title)}</strong> — <a href="${r.admin_url}" target="_blank">פתח בשופיפיי</a>`;
      } else {
        div.innerHTML = `<span class="status-icon">❌</span> <strong>${escHtml(r.title)}</strong> <span class="err">${escHtml(r.message)}</span>`;
      }
      container.appendChild(div);
    }
    container.scrollIntoView({behavior: 'smooth'});
  }

  // ---- Helpers ----
  function showLoading(text) {
    document.getElementById('loading-text').textContent = text || 'טוען...';
    document.getElementById('loading').style.display = 'flex';
  }

  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Enter key support
  document.getElementById('product-url').addEventListener('keydown', e => { if (e.key === 'Enter') scrapeUrl(); });
  document.getElementById('search-keyword').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  init();
</script>
</body>
</html>
